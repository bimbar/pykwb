[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"
include = ["pykwb/**/*.py", "tests/**/*.py", "setup.py"]

[tool.ruff.lint]
select = ["F401", "F841", "RUF059"]

[tool.vulture]
paths = ["pykwb", "tests", "setup.py"]
# Unused globals are reported at 60%; a higher threshold would miss them.
min_confidence = 60
